name: hello_buddy
description: "Hello Buddy — Neo-Graphic Desktop Companion Robot App"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  firebase_database: ^11.2.1
  
  # Google Sign-In
  google_sign_in: ^6.2.2
  
  # Networking (Groq API)
  http: ^1.3.0
  
  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Permissions (runtime)
  permission_handler: ^11.3.1

  # Camera / Image picker
  image_picker: ^1.1.2
  just_audio: ^0.10.6

  # Native Android Intent launching (alarm, calendar, etc.)
  android_intent_plus: ^5.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
